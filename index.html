<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#03111d" />
  <meta name="description" content="Seiko watches ecommerce storefront." />
  <title>Seiko Watches — Timeless Since 1881</title>
  <style>
    *{box-sizing:border-box}
    html{scroll-behavior:smooth;background:#020b12}
    html,body{margin:0;min-height:100%;background:#020b12;color:#fff;font-family:Arial,Helvetica,sans-serif}
    body{overflow-x:hidden}
    .page{width:100%;display:flex;justify-content:center;background:#020b12}
    .stage{position:relative;width:min(100vw,941px);min-height:100vh;line-height:0;background:#061421;box-shadow:0 0 80px rgba(0,0,0,.45)}
    .stage>img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none;opacity:0;transition:opacity .18s ease}
    .stage>img.ready{opacity:1}
    .loader{position:absolute;inset:0 0 auto 0;height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 30%,#12304a 0,#061421 43%,#020b12 100%);font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:#a8b7c5;line-height:1.4}
    .loader.hidden{display:none}
    .hotspot{position:absolute;display:block;border:0;background:transparent;cursor:pointer;line-height:normal;padding:0;margin:0;outline:none;z-index:4}
    .hotspot:focus-visible{outline:2px solid #67a9ff;outline-offset:2px;border-radius:4px;background:rgba(41,116,214,.12)}
    .toast{position:fixed;z-index:99;left:50%;bottom:24px;transform:translate(-50%,20px);background:rgba(4,16,27,.94);color:#fff;border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:12px 18px;font-size:14px;line-height:1.2;letter-spacing:.01em;box-shadow:0 16px 50px rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:.22s ease;backdrop-filter:blur(14px)}
    .toast.show{opacity:1;transform:translate(-50%,0)}
    @media (min-width:942px){.stage{border-left:1px solid rgba(255,255,255,.04);border-right:1px solid rgba(255,255,255,.04)}}
    @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.toast,.stage>img{transition:none}}
  </style>
</head>
<body>
  <main class="page">
    <section class="stage" aria-label="Seiko ecommerce homepage">
      <div class="loader" id="loader">Loading Seiko storefront</div>
      <img id="storeMockup" alt="Seiko watches ecommerce storefront with navigation, hero banner, watch categories, featured products, new arrivals, shipping and warranty benefits, newsletter, and footer." />

      <a class="hotspot" href="#featured" aria-label="Shop all watches" title="Shop all watches" style="left:4.3%;top:18.2%;width:16.8%;height:3.2%"></a>
      <a class="hotspot" href="#featured" aria-label="Automatic watches" title="Automatic watches" style="left:3.4%;top:25.3%;width:17.8%;height:10.7%"></a>
      <a class="hotspot" href="#featured" aria-label="Dress watches" title="Dress watches" style="left:22%;top:25.3%;width:17.8%;height:10.7%"></a>
      <a class="hotspot" href="#featured" aria-label="Diver watches" title="Diver watches" style="left:40.6%;top:25.3%;width:17.8%;height:10.7%"></a>
      <a class="hotspot" href="#featured" aria-label="Classic watches" title="Classic watches" style="left:59.2%;top:25.3%;width:17.8%;height:10.7%"></a>
      <a class="hotspot" href="#featured" aria-label="Everyday watches" title="Everyday watches" style="left:77.8%;top:25.3%;width:17.8%;height:10.7%"></a>

      <span id="featured" aria-hidden="true" style="position:absolute;top:36.5%;left:0"></span>
      <button class="hotspot cart" aria-label="Add first watch to cart" style="left:4.5%;top:57.5%;width:15.7%;height:2.2%"></button>
      <button class="hotspot cart" aria-label="Add second watch to cart" style="left:23%;top:57.5%;width:15.7%;height:2.2%"></button>
      <button class="hotspot cart" aria-label="Add third watch to cart" style="left:41.6%;top:57.5%;width:15.7%;height:2.2%"></button>
      <button class="hotspot cart" aria-label="Add fourth watch to cart" style="left:60.2%;top:57.5%;width:15.7%;height:2.2%"></button>
      <button class="hotspot cart" aria-label="Add fifth watch to cart" style="left:78.8%;top:57.5%;width:15.7%;height:2.2%"></button>

      <a class="hotspot" href="#featured" aria-label="Shop new arrivals" title="Shop new arrivals" style="left:4.4%;top:69%;width:16.9%;height:2.5%"></a>
      <button class="hotspot subscribe" aria-label="Subscribe to newsletter" style="left:83.5%;top:84.6%;width:11.3%;height:2.1%"></button>
    </section>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
    const toast=document.getElementById('toast');
    const image=document.getElementById('storeMockup');
    const loader=document.getElementById('loader');
    let timer;

    function showToast(message){
      clearTimeout(timer);
      toast.textContent=message;
      toast.classList.add('show');
      timer=setTimeout(()=>toast.classList.remove('show'),1800);
    }

    async function loadExactMockup(){
      try{
        const paths=['assets/mockup-0.txt','assets/mockup-1.txt'];
        const chunks=await Promise.all(paths.map(async path=>{
          const response=await fetch(path,{cache:'force-cache'});
          if(!response.ok) throw new Error('Asset failed to load');
          return (await response.text()).trim();
        }));
        image.onload=()=>{
          image.classList.add('ready');
          loader.classList.add('hidden');
        };
        image.src='data:image/webp;base64,'+chunks.join('');
      }catch(error){
        loader.textContent='Unable to load storefront image';
        console.error(error);
      }
    }

    document.querySelectorAll('.cart').forEach(btn=>btn.addEventListener('click',()=>showToast('Added to cart')));
    document.querySelector('.subscribe')?.addEventListener('click',()=>showToast('Newsletter signup selected'));
    loadExactMockup();
  </script>
</body>
</html>
