<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#071827" />
  <meta name="description" content="Premium Seiko watch ecommerce storefront." />
  <title>Seiko Watches — Timeless Since 1881</title>
  <link rel="preload" as="image" href="./assets/hero-watch.webp" fetchpriority="high" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/htm@3.1.1/dist/htm.js" crossorigin></script>
  <script src="./app.js"></script>
  <script>
    (() => {
      const applyHeroImage = () => {
        const image = document.querySelector('.hero-watch img.watch-img');
        if (!image) return false;
        image.src = './assets/hero-watch.webp';
        image.alt = 'Seiko 5 blue dial watch';
        image.removeAttribute('srcset');
        return true;
      };
      if (!applyHeroImage()) {
        const observer = new MutationObserver(() => {
          if (applyHeroImage()) observer.disconnect();
        });
        observer.observe(document.getElementById('root'), { childList: true, subtree: true });
        setTimeout(() => observer.disconnect(), 5000);
      }
    })();
  </script>
</body>
</html>
